<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa;
    --fg: #1f2328;
    --muted: #59636e;
    --border: #d1d9e0;
    --surface: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #9198a1;
      --border: #3d444d;
      --surface: #151b23;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 4px; }
  .kind { color: var(--muted); font-size: 0.85rem; margin: 0 0 20px; }
  .diagram {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
    overflow-x: auto;
  }
  pre.mermaid { margin: 0; text-align: center; font: inherit; }
  pre.mermaid:not([data-processed]) { color: var(--muted); white-space: pre; text-align: left; }
</style>
</head>
<body>
<main>
  <h1>{{TITLE}}</h1>
  <p class="kind">Sequence diagram</p>
  <div class="diagram">
<pre class="mermaid">
{{DIAGRAM}}
</pre>
  </div>
</main>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.esm.min.mjs";
  const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  mermaid.initialize({
    startOnLoad: true,
    securityLevel: "strict",
    theme: dark ? "dark" : "neutral",
    sequence: { showSequenceNumbers: true },
  });
</script>
</body>
</html>
